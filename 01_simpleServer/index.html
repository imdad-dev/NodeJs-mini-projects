<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Node Server</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #333; }
        p { color: #666; line-height: 1.6; }
        .status {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: #e7f4e8;
            color: #2ecc71;
            font-weight: bold;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Node.js Server</h1>
        <p>If you can see this styled page, your <strong>text/html</strong> and <strong>text/css</strong> MIME types are working perfectly!</p>
        <div class="status">● Server Online</div>
        <br>
        <button id="testBtn">Click to Test JS</button>
    </div>

    <script>
        // Testing the text/javascript MIME type
        document.getElementById('testBtn').addEventListener('click', () => {
            alert('JavaScript is linked and working!');
        });
    </script>
</body>
</html>
